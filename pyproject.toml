[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-invoice-reconciliation"
version = "0.1.0"
description = "Supplier invoice reconciliation API and data model"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]
llm = ["groq>=0.11,<2"]
finetune = [
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3,<4",
  "peft>=0.14,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
  "trl>=0.15,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
