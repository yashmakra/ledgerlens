services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
      POSTGRES_DB: reconcile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconcile"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://reconcile:reconcile@db:5432/reconcile
      DOCUMENT_STORAGE_DIR: /app/data/documents
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    ports:
      - "8000:8000"
    volumes:
      - document_data:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://reconcile:reconcile@db:5432/reconcile
      DOCUMENT_STORAGE_DIR: /app/data/documents
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - document_data:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    
volumes:
  pgdata:
  document_data:
